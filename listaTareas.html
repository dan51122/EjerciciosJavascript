<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista Interactiva de Tareas</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .contenedor { max-width: 450px; padding: 20px; border: 1px solid #ccc; border-radius: 5px; }
        .controles { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] { flex: 1; padding: 8px; }
        button { padding: 8px 15px; background-color: #ffc107; border: none; cursor: pointer; font-weight: bold; }
        ul { list-style-type: none; padding: 0; }
        li { display: flex; align-items: center; justify-content: space-between; padding: 10px; background-color: #f9f9f9; border-bottom: 1px solid #ddd; }
        
        .completada span { text-decoration: line-through; color: #888; }
        
        .btn-eliminar { background-color: #dc3545; color: white; padding: 5px 10px; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="contenedor">
        <h2>Lista de Tareas</h2>
        <a href="index.html">← Volver al menú</a>
        <hr>

        <div class="controles">
            <input type="text" id="nuevaTarea" placeholder="Escribe una tarea...">
            <button onclick="agregarTarea()">Agregar tarea</button>
        </div>

        <ul id="lista"></ul>
    </div>

    <script>
        function agregarTarea() {
            const inputTarea = document.getElementById("nuevaTarea");
            const textoTarea = inputTarea.value.trim();

            if (textoTarea === "") {
                alert("Por favor, escribe una tarea válida.");
                return;
            }

            const li = document.createElement("li");

            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.addEventListener("change", function() {
                if (this.checked) {
                    li.classList.add("completada");
                } else {
                    li.classList.remove("completada");
                }
            });

            const spanTexto = document.createElement("span");
            spanTexto.textContent = textoTarea;
            spanTexto.style.flex = "1"; 
            spanTexto.style.marginLeft = "10px";

            const btnEliminar = document.createElement("button");
            btnEliminar.textContent = "Eliminar";
            btnEliminar.className = "btn-eliminar";
            btnEliminar.addEventListener("click", function() {
                li.remove();
            });

            li.appendChild(checkbox);
            li.appendChild(spanTexto);
            li.appendChild(btnEliminar);

            document.getElementById("lista").appendChild(li);

            inputTarea.value = "";
            inputTarea.focus();
        }
    </script>
</body>
</html>
