<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Analizador de Calificaciones</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .contenedor { max-width: 500px; padding: 20px; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px; width: 100%; background-color: #17a2b8; color: white; border: none; cursor: pointer; }
        .resultados { margin-top: 20px; padding: 15px; background-color: #f1f1f1; border-radius: 5px; }
        .error { color: red; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="contenedor">
        <h2>Analizador de Calificaciones</h2>
        <a href="index.html">← Volver al menú</a>
        <hr>

        <p>Notas a analizar: <strong id="listaNotas"></strong></p>
        <button onclick="analizar()">Analizar</button>

        <div id="mensajeError" class="error"></div>
        <div id="zonaResultados" class="resultados" style="display: none;"></div>
    </div>

    <script>
        const notas = [8, 6, 9, 7, 5, 10, 4, 7];

        document.getElementById("listaNotas").textContent = notas.join(", ");

        function analizar() {
            const divError = document.getElementById("mensajeError");
            const divResultados = document.getElementById("zonaResultados");
            
            divError.innerHTML = "";
            divResultados.style.display = "none";

            for (let i = 0; i < notas.length; i++) {
                if (notas[i] < 0 || notas[i] > 10) {
                    divError.innerHTML = `Error: La nota ${notas[i]} está fuera del rango permitido (0-10).`;
                    return;
                }
            }

            let suma = 0;
            let max = notas[0];
            let min = notas[0];
            let aprobadas = 0;
            let reprobadas = 0;

            for (let i = 0; i < notas.length; i++) {
                let notaActual = notas[i];
                suma += notaActual;
                
                if (notaActual > max) { max = notaActual; }
                if (notaActual < min) { min = notaActual; }
                
                if (notaActual >= 7) {
                    aprobadas++;
                } else {
                    reprobadas++;
                }
            }

            let promedio = suma / notas.length;

            divResultados.style.display = "block";
            divResultados.innerHTML = `
                <p><strong>Calificaciones:</strong> ${notas.join(", ")}</p>
                <p><strong>Promedio:</strong> ${promedio.toFixed(2)}</p>
                <p><strong>Calificación más alta:</strong> ${max}</p>
                <p><strong>Calificación más baja:</strong> ${min}</p>
                <p><strong>Notas aprobadas:</strong> ${aprobadas}</p>
                <p><strong>Notas no aprobadas:</strong> ${reprobadas}</p>
            `;
        }      
    </script>
</body>
</html>
